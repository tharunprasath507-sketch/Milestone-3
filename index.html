<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Task List</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="task-manager">
      <header class="page-header">
        <div class="header-copy">
          <p class="eyebrow">A little progress every day</p>
          <h1>My Task List</h1>
          <p class="intro">Add a task, and check your list whenever you need it.</p>
        </div>
        <svg class="header-picture" viewBox="0 0 180 150" role="img" aria-labelledby="picture-title">
          <title id="picture-title">A colorful checklist with a plant</title>
          <path d="M37 20h82a10 10 0 0 1 10 10v100H37z" fill="#fff" />
          <path d="M50 46h13l5 5 9-11" fill="none" stroke="#44a687" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
          <path d="M85 47h29M50 72h13l5 5 9-11M85 73h22" fill="none" stroke="#7186c5" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
          <path d="M50 99h13l5 5 9-11M85 100h26" fill="none" stroke="#f0a34a" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
          <path d="M24 128h137" fill="none" stroke="#375079" stroke-linecap="round" stroke-width="5" />
          <path d="M142 128c0-22 8-34 20-42M153 103c-12 0-19-7-21-19 12 0 20 7 21 19ZM159 91c0-12 6-20 17-24 0 11-6 19-17 24Z" fill="#55ad84" stroke="#347e67" stroke-linejoin="round" stroke-width="2" />
          <circle cx="27" cy="39" r="5" fill="#f3bd55" />
          <path d="M145 35v12m-6-6h12" stroke="#ed8a70" stroke-linecap="round" stroke-width="3" />
        </svg>
      </header>

      <section class="task-panel" aria-label="Task manager">
        <form id="form" class="task-form">
          <label for="text">New task</label>
          <div class="form-controls">
            <input id="text" name="task" type="text" maxlength="200" placeholder="What needs to be done?">
            <button class="add-button" type="submit">Add Task</button>
          </div>
        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <ul id="list" class="task-list" aria-label="Tasks"></ul>
      </section>
    </main>
  </body>
</html>
